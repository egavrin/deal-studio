name: PR Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: verification scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      training: ${{ steps.scope.outputs.training }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          lfs: false
      - id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          else
            changed="$(git diff-tree --no-commit-id --name-only --root -r HEAD)"
          fi
          training=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] || \
             printf '%s\n' "$changed" | grep -Eq '^(training/|\.github/workflows/pr\.yml$)'; then
            training=true
          fi
          printf 'training=%s\n' "$training" >> "$GITHUB_OUTPUT"
          git diff --check

  quality:
    name: Kotlin and architecture
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: ${{ runner.os }}-aar-${{ hashFiles('.gitattributes', 'app/libs/**') }}
      - name: Materialize runtime AAR
        run: |
          git lfs pull --include='app/libs/**'
          test "$(wc -c < app/libs/sherpa-onnx-static-link-onnxruntime-1.13.4.aar)" -gt 30000000
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Check narrow architecture
        run: |
          python3 scripts/check_core_scope.py
          python3 scripts/check_nlu_eval_manifest.py
          python3 scripts/check_release_contract.py
      - name: Unit, static and AndroidTest compilation
        run: >-
          ./gradlew --no-daemon --stacktrace
          testDebugUnitTest :core:test :deepseek-connector:testDebugUnitTest
          :app:compileDebugAndroidTestKotlin
          ktlintCheck detekt lintDebug
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-reports-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            app/build/reports/
            app/build/test-results/
            core/build/reports/
            deepseek-connector/build/reports/

  apk:
    name: ARM64 APK
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: true
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-assistant-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  release-like:
    name: minified release-like AAB
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: true
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Build unsigned minified artifact
        run: ./gradlew --no-daemon --stacktrace bundleRelease lintRelease
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-like-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 7

  rubert-training:
    name: Training contracts
    needs: scope
    if: needs.scope.outputs.training == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            training/rubert/requirements.txt
            training/generated_ui/requirements.txt
      - name: Install pinned training stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r training/rubert/requirements.txt
          python -m pip install -r training/generated_ui/requirements.txt
          python -m pip check
      - name: Validate training code and ONNX contract
        run: |
          for test_script in training/test_*.py; do
            PYTHONPATH=. python "$test_script"
          done
          python training/generated_ui/build_artifacts.py --check
          python training/rubert/ci_export_smoke.py --output-dir build/rubert-ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rubert-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/rubert-ci/
          retention-days: 7

  quality-gate:
    name: quality
    if: always()
    needs:
      - quality
      - apk
      - release-like
      - rubert-training
    runs-on: ubuntu-latest
    steps:
      - name: Require successful checks
        env:
          QUALITY: ${{ needs.quality.result }}
          APK: ${{ needs.apk.result }}
          RELEASE_LIKE: ${{ needs.release-like.result }}
          RUBERT: ${{ needs.rubert-training.result }}
        run: |
          test "$QUALITY" = success
          test "$APK" = success
          test "$RELEASE_LIKE" = success
          test "$RUBERT" = success -o "$RUBERT" = skipped
